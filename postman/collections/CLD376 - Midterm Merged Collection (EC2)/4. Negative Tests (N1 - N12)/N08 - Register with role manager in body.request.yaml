$kind: http-request
description: Expects 201, but role is safely forced to customer.
url: http://13.220.57.201:3000/api/auth/register
method: POST
body:
  type: json
  content: |-
    {
      "name": "Privilege Escalation Test",
      "email": "hacker9154@shop.test",
      "password": "Test1234!",
      "role": "manager",
      "activity": "midterm"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      pm.test("Role is customer", () => pm.expect(pm.response.json().user.role).to.eql("customer"));
    language: text/javascript
order: 8000
