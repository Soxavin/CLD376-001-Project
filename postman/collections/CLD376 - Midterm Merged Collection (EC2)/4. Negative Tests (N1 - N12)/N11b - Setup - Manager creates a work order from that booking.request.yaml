$kind: http-request
description: "SETUP for N11, no screenshot needed. Saves inProgressWorkOrderId (a WORK ORDER id)."
url: {{gateway}}/api/work-orders
method: POST
body:
  type: json
  content: |-
    {
      "bookingId": "{{pendingBookingId}}",
      "mechanicId": "{{mechanicId}}",
      "activity": "midterm"
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      const res = pm.response.json();
      pm.environment.set("inProgressWorkOrderId", res._id);
    language: text/javascript
order: 10200
