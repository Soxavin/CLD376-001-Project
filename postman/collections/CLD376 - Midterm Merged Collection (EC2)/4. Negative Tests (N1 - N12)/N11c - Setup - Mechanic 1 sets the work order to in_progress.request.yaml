$kind: http-request
description: "SETUP for N11, no screenshot needed. The work order must stay unfinished."
url: http://13.220.57.201:3000/api/work-orders/{{inProgressWorkOrderId}}/status
method: PATCH
body:
  type: json
  content: |-
    {
      "status": "in_progress",
      "activity": "midterm"
    }
auth:
  type: bearer
  credentials:
    token: "{{mechanicToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 10300
