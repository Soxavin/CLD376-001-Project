$kind: http-request
name: N11c - Setup - Mechanic 1 sets the work order to in_progress (do NOT complete it)
description: SETUP for N11, no screenshot needed. The work order must stay unfinished.
url: "{{gateway}}/api/work-orders/{{inProgressWorkOrderId}}/status"
method: PATCH
body:
  type: json
  content: |-
    {
      "status": "in_progress",
      "activity": "midterm"
    }
auth:
  type: bearer
  credentials:
    token: "{{mechanicToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 14000
