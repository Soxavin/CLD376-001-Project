$kind: http-request
description: Expects 403 FORBIDDEN (ownership check).
url: {{gateway}}/api/vehicles/{{vehicleId}}
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customer2Token}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 6000
