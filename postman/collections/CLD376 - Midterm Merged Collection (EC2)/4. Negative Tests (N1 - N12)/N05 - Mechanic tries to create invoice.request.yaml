$kind: http-request
description: Expects 403 FORBIDDEN.
url: {{gateway}}/api/invoices
method: POST
body:
  type: json
  content: |-
    {
      "workOrderId": "{{workOrderId}}",
      "lineItems": [
        {
          "description": "Test",
          "quantity": 1,
          "unitPriceCents": 1000
        }
      ],
      "activity": "midterm"
    }
auth:
  type: bearer
  credentials:
    token: "{{mechanicToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 5000
