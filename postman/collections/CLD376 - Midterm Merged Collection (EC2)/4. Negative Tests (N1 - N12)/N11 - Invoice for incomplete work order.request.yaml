$kind: http-request
description: Expects 400 WORK_ORDER_NOT_COMPLETED. Uses inProgressWorkOrderId from N11b (a work order id, not a user id).
url: "{{gateway}}/api/invoices"
method: POST
body:
  type: json
  content: |-
    {
      "workOrderId": "{{inProgressWorkOrderId}}",
      "lineItems": [
        {
          "description": "Test",
          "quantity": 1,
          "unitPriceCents": 2000
        }
      ],
      "activity": "midterm"
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      pm.test("Error code WORK_ORDER_NOT_COMPLETED", () => pm.expect(pm.response.json().error.code).to.eql("WORK_ORDER_NOT_COMPLETED"));
    language: text/javascript
order: 15000
