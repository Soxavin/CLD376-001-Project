$kind: http-request
description: Expects 403 FORBIDDEN.
url: http://13.220.57.201:3000/api/catalog
method: POST
body:
  type: json
  content: |-
    {
      "name": "Unauthorized Service",
      "priceCents": 1000,
      "activity": "midterm"
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 4000
