$kind: http-request
description: Expects 401 INVALID_CREDENTIALS.
url: {{gateway}}/api/auth/login
method: POST
body:
  type: json
  content: |-
    {
      "email": "manager@shop.test",
      "password": "WrongPassword123!",
      "activity": "midterm"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 1000
