$kind: http-request
description: Expects 403 FORBIDDEN (assigned mechanic check).
url: http://13.220.57.201:3000/api/work-orders/{{workOrderId}}/status
method: PATCH
body:
  type: json
  content: |-
    {
      "status": "in_progress",
      "activity": "midterm"
    }
auth:
  type: bearer
  credentials:
    token: "{{mechanic2Token}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 7000
