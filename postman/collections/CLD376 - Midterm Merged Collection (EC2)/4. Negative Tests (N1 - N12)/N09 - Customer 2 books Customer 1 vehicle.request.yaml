$kind: http-request
description: Expects 400 VEHICLE_NOT_OWNED.
url: http://13.220.57.201:3000/api/bookings
method: POST
body:
  type: json
  content: |-
    {
      "vehicleId": "{{vehicleId}}",
      "serviceRequested": "Hijack Service",
      "preferredDate": "2026-11-25T10:00:00.000Z",
      "activity": "midterm"
    }
auth:
  type: bearer
  credentials:
    token: "{{customer2Token}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 9000
