$kind: http-request
description: Logs in as mechanic 1 and auto-saves mechanicToken and mechanicId.
url: http://13.220.57.201:3000/api/auth/login
method: POST
body:
  type: json
  content: |-
    {
      "email": "mechanic1@shop.test",
      "password": "Test1234!",
      "activity": "midterm"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const res = pm.response.json();
      pm.environment.set("mechanicToken", res.token);
      pm.environment.set("mechanicId", res.user._id);
    language: text/javascript
order: 5000
