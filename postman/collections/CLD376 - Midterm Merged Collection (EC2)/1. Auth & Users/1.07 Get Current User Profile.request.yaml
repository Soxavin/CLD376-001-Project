$kind: http-request
description: Returns authenticated user identity and claims from gateway headers.
url: {{gateway}}/api/auth/me
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 7000
