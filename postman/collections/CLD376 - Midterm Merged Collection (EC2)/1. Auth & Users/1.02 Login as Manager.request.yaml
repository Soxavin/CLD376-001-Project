$kind: http-request
description: Logs in as manager and auto-saves managerToken and managerId.
url: http://13.220.57.201:3000/api/auth/login
method: POST
body:
  type: json
  content: |-
    {
      "email": "manager@shop.test",
      "password": "Test1234!",
      "activity": "midterm"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const res = pm.response.json();
      pm.environment.set("managerToken", res.token);
      pm.environment.set("managerId", res.user._id);
    language: text/javascript
order: 2000
