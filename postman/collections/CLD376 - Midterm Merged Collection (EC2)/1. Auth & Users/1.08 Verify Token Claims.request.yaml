$kind: http-request
description: Re-verifies token signature and claims.
url: http://13.220.57.201:3000/api/auth/verify
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 8000
