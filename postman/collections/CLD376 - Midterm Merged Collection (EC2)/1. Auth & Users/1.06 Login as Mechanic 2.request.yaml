$kind: http-request
description: Logs in as mechanic 2 and auto-saves mechanic2Token and mechanic2Id.
url: {{gateway}}/api/auth/login
method: POST
body:
  type: json
  content: |-
    {
      "email": "mechanic2@shop.test",
      "password": "Test1234!",
      "activity": "midterm"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const res = pm.response.json();
      pm.environment.set("mechanic2Token", res.token);
      pm.environment.set("mechanic2Id", res.user._id);
    language: text/javascript
order: 6000
