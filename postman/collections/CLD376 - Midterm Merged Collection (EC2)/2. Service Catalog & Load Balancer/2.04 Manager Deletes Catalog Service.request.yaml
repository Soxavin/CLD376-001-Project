$kind: http-request
description: "Manager deletes the service created in 2.6. Expects 204 with no body. Re-run 2.6 to create another one."
url: http://13.220.57.201:3000/api/catalog/{{catalogServiceId}}
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 204", () => pm.response.to.have.status(204));
    language: text/javascript
order: 2000
