$kind: http-request
description: "Manager changes the price of the service created in 2.6. Expects 200 with the new price (5500)."
url: http://13.220.57.201:3000/api/catalog/{{catalogServiceId}}
method: PUT
body:
  type: json
  content: |-
    {
      "name": "Diagnostic Scan 583",
      "description": "Comprehensive OBD-II diagnostics scan (updated)",
      "priceCents": 5500,
      "active": true,
      "activity": "midterm"
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("New price", () => pm.expect(pm.response.json().priceCents).to.eql(5500));
    language: text/javascript
order: 1000
