$kind: http-request
description: Mechanic logs a diagnostic finding note.
url: http://13.220.57.201:3000/api/notes
method: POST
body:
  type: json
  content: |-
    {
      "workOrderId": "{{workOrderId}}",
      "type": "finding",
      "text": "Brake pads worn down to 2mm, rotors in good condition",
      "activity": "midterm"
    }
auth:
  type: bearer
  credentials:
    token: "{{mechanicToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      const res = pm.response.json();
      pm.environment.set("noteId", res._id);
    language: text/javascript
order: 6000
