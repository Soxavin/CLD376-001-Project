$kind: http-request
description: Manager approves the pending booking.
url: {{gateway}}/api/bookings/{{bookingId}}/status
method: PATCH
body:
  type: json
  content: |-
    {
      "status": "approved",
      "activity": "midterm"
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
