$kind: http-request
description: "SETUP for 6.4, no screenshot needed. Creates a throwaway car with a unique plate. Saves spareVehicleId."
url: http://13.220.57.201:3000/api/vehicles
method: POST
body:
  type: json
  content: |-
    {
      "plateNumber": "SPARE-{{$timestamp}}",
      "make": "Honda",
      "model": "Civic",
      "year": 2018,
      "activity": "midterm"
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      const res = pm.response.json();
      pm.environment.set("spareVehicleId", res._id);
    language: text/javascript
order: 3000
