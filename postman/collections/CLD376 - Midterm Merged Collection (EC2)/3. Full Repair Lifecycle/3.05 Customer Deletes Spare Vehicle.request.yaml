$kind: http-request
description: "Customer 1 deletes the throwaway car. Expects 204 with no body."
url: http://13.220.57.201:3000/api/vehicles/{{spareVehicleId}}
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 204", () => pm.response.to.have.status(204));
    language: text/javascript
order: 4000
