$kind: http-request
description: "Manager sees the pending queue. Expects 200 with at least the spare booking from 7.1."
url: http://13.220.57.201:3000/api/bookings?status=pending
method: GET
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Is an array", () => pm.expect(pm.response.json()).to.be.an("array"));
    language: text/javascript
order: 2000
