$kind: http-request
description: Mechanic marks work order completed and sets timestamp.
url: http://13.220.57.201:3000/api/work-orders/{{workOrderId}}/status
method: PATCH
body:
  type: json
  content: |-
    {
      "status": "completed",
      "activity": "midterm"
    }
auth:
  type: bearer
  credentials:
    token: "{{mechanicToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 8000
