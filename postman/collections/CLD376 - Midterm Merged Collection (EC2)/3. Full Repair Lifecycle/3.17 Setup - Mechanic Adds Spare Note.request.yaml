$kind: http-request
description: "SETUP for 8.4, no screenshot needed. Mechanic 1 adds a throwaway note. Saves spareNoteId."
url: http://13.220.57.201:3000/api/notes
method: POST
body:
  type: json
  content: |-
    {
      "workOrderId": "{{workOrderId}}",
      "type": "work_done",
      "text": "Spare note to be deleted",
      "activity": "midterm"
    }
auth:
  type: bearer
  credentials:
    token: "{{mechanicToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      const res = pm.response.json();
      pm.environment.set("spareNoteId", res._id);
    language: text/javascript
order: 3000
