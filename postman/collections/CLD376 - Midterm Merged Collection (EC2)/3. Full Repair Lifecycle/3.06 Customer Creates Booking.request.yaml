$kind: http-request
description: Customer books service for their vehicle. Auto-saves bookingId.
url: http://13.220.57.201:3000/api/bookings
method: POST
body:
  type: json
  content: |-
    {
      "vehicleId": "{{vehicleId}}",
      "serviceRequested": "Brake Inspection and Oil Change",
      "preferredDate": "2026-11-20T10:00:00.000Z",
      "activity": "midterm"
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      const res = pm.response.json();
      pm.environment.set("bookingId", res._id);
    language: text/javascript
order: 2000
