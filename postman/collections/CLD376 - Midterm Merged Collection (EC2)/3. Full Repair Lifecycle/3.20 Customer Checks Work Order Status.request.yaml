$kind: http-request
description: Customer inspects work order to verify completed status.
url: http://13.220.57.201:3000/api/work-orders/{{workOrderId}}
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 9000
