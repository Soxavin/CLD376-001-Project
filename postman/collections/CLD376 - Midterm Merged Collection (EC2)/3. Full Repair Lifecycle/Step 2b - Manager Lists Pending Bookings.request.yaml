$kind: http-request
description: Manager sees the pending queue (the Step 2 booking and the spare one). Expects 200.
url: "{{gateway}}/api/bookings?status=pending"
method: GET
queryParams:
  status: pending
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Is an array", () => pm.expect(pm.response.json()).to.be.an("array"));
    language: text/javascript
order: 8000
