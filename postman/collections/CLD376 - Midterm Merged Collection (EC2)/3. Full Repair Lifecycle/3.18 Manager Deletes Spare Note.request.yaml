$kind: http-request
description: "Manager deletes the throwaway note. Expects 204 with no body."
url: http://13.220.57.201:3000/api/notes/{{spareNoteId}}
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 204", () => pm.response.to.have.status(204));
    language: text/javascript
order: 4000
