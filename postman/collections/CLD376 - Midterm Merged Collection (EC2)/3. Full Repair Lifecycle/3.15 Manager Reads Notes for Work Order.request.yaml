$kind: http-request
description: "Manager reads all notes of the lifecycle work order. Expects 200 with both notes (finding and work_done)."
url: {{gateway}}/api/notes?workOrderId={{workOrderId}}
method: GET
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Is an array", () => pm.expect(pm.response.json()).to.be.an("array"));
    language: text/javascript
order: 1000
