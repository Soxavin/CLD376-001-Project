$kind: http-request
description: Mechanic logs completed work note.
url: {{gateway}}/api/notes
method: POST
body:
  type: json
  content: |-
    {
      "workOrderId": "{{workOrderId}}",
      "type": "work_done",
      "text": "Replaced front brake pads with OEM pads and tested braking performance",
      "activity": "midterm"
    }
auth:
  type: bearer
  credentials:
    token: "{{mechanicToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 7000
