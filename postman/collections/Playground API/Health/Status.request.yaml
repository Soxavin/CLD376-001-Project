$kind: http-request
description: No key needed. `up` means the model service answers its health check; `busy` means someone else's request holds its only slot right now.
url: "{{baseUrl}}/status"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () {
          pm.response.to.have.status(200);
      });
      const body = pm.response.json();
      pm.test('all model services are up', function () {
          pm.expect(body.services.llm.up).to.eql(true);
          pm.expect(body.services.speech.up).to.eql(true);
          pm.expect(body.services.vision.up).to.eql(true);
      });
    language: text/javascript
order: 1000
