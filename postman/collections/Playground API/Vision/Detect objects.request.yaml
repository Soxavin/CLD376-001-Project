$kind: http-request
description: YOLO11n detection on the standard bus sample.
url: "{{baseUrl}}/vision/detect?conf=0.4"
method: POST
queryParams:
  conf: "0.4"
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - fixtures/bus.jpg
scripts:
  - type: afterResponse
    code: |-
      pm.response.to.have.status(200);
      const labels = pm.response.json().detections.map(function (detection) { return detection.label; });
      pm.test('detections is an array', function () {
          pm.expect(labels).to.be.an('array');
      });
      pm.test('finds the bus and people', function () {
          pm.expect(labels).to.include('bus');
          pm.expect(labels).to.include('person');
      });
    language: text/javascript
order: 1000
