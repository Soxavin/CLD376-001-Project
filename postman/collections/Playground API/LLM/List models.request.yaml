$kind: http-request
url: "{{baseUrl}}/llm/api/tags"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.response.to.have.status(200);
      const body = pm.response.json();
      pm.test('models is an array', function () {
          pm.expect(body.models).to.be.an('array');
      });
      pm.test('the environment model is installed', function () {
          pm.expect(body.models.map(function (model) { return model.name; })).to.include(pm.environment.get('model'));
      });
    language: text/javascript
order: 1000
