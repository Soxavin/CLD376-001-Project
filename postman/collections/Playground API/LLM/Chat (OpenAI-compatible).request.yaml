$kind: http-request
description: The same model through the OpenAI wire format.
url: "{{baseUrl}}/llm/v1/chat/completions"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "model": "{{model}}",
      "messages": [
        { "role": "user", "content": "Write a haiku about rice." }
      ],
      "reasoning_effort": "none",
      "stream": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.response.to.have.status(200);
      pm.test('message content is not empty', function () {
          pm.expect(pm.response.json().choices[0].message.content).to.be.a('string').and.not.empty;
      });
    language: text/javascript
order: 3000
