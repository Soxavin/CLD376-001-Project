$kind: http-request
description: "Ollama's native API. `think: false` skips qwen3's reasoning pass."
url: "{{baseUrl}}/llm/api/chat"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "model": "{{model}}",
      "messages": [
        { "role": "user", "content": "Explain what an API is in one sentence." }
      ],
      "think": false,
      "stream": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.response.to.have.status(200);
      pm.test('message content is not empty', function () {
          pm.expect(pm.response.json().message.content).to.be.a('string').and.not.empty;
      });
    language: text/javascript
order: 2000
