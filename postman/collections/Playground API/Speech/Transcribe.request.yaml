$kind: http-request
description: whisper.cpp's sample clip should contain the word "country".
url: "{{baseUrl}}/speech/inference"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - fixtures/jfk.wav
    - type: text
      key: response_format
      value: json
    - type: text
      key: language
      value: en
scripts:
  - type: afterResponse
    code: |-
      pm.response.to.have.status(200);
      pm.test('transcription contains country', function () {
          pm.expect(pm.response.json().text.toLowerCase()).to.include('country');
      });
    language: text/javascript
order: 1000
