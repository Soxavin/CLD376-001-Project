$kind: http-request
description: "No auth on purpose: everything except /status and /healthz needs a key."
url: "{{baseUrl}}/llm/api/chat"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{ "model": "{{model}}", "messages": [{ "role": "user", "content": "hi" }], "stream": false }'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.response.to.have.status(401);
    language: text/javascript
order: 1000
