# Registration: the only service that writes auth_db.users. Customers sign up here,
# and the manager creates mechanic or manager accounts. Login reads the same database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration
  labels:
    app: registration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registration
  template:
    metadata:
      labels:
        app: registration
    spec:
      containers:
        - name: registration
          image: shop-registration:v2
          imagePullPolicy: Never          # built inside Minikube, not pulled from Docker Hub
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: INSTANCE_NAME         # the pod's own name, so we can see who answered
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MONGO_URI             # .../auth_db, shared with Login (read-only there)
              valueFrom:
                secretKeyRef:
                  name: shop-secrets
                  key: MONGO_URI_AUTH
          readinessProbe:                 # only send traffic once it's connected and answering
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:                  # restart it if it stops answering
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
