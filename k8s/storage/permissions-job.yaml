# Run after the PVC is created and before deploying the gateway.
# Makes the volume writable by the non-root gateway container.
apiVersion: batch/v1
kind: Job
metadata:
  name: fix-log-permissions
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: chmod
          image: busybox:1.36
          command: ["sh", "-c", "chmod 0777 /logs && echo permissions fixed"]
          volumeMounts:
            - name: logs
              mountPath: /logs
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: shared-logs
