# Template only: placeholders, safe to commit.
# Copy to k8s/config/secret.yaml (gitignored), fill in the real values, then:
#   kubectl apply -f k8s/config/secret.yaml
# stringData takes plain text; Kubernetes base64-encodes it when it stores the Secret.
# Every URI points at the same Atlas cluster, and each one ends in that service's database name.
apiVersion: v1
kind: Secret
metadata:
  name: shop-secrets
type: Opaque
stringData:
  JWT_SECRET: "<long-random-string, same value the gateway and login share>"
  MONGO_URI_AUTH: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/auth_db?retryWrites=true&w=majority"
  MONGO_URI_BOOKINGS: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/bookings_db?retryWrites=true&w=majority"
  MONGO_URI_VEHICLES: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/vehicles_db?retryWrites=true&w=majority"
  MONGO_URI_WORKORDERS: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/workorders_db?retryWrites=true&w=majority"
  MONGO_URI_NOTES: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/notes_db?retryWrites=true&w=majority"
  MONGO_URI_BILLING: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/billing_db?retryWrites=true&w=majority"
  MONGO_URI_CATALOG: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/catalog_db?retryWrites=true&w=majority"
