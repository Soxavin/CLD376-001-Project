# Repair Notes: mechanics record findings and work done on a work order.
# Calls no other service; talks only to notes_db on Atlas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repair-notes
  labels:
    app: repair-notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repair-notes
  template:
    metadata:
      labels:
        app: repair-notes
    spec:
      containers:
        - name: repair-notes
          image: shop-repair-notes:v2
          imagePullPolicy: Never          # built inside Minikube, not pulled from Docker Hub
          ports:
            - containerPort: 3006
          env:
            - name: PORT
              value: "3006"
            - name: INSTANCE_NAME         # the pod's own name, so we can see who answered
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: shop-secrets
                  key: MONGO_URI_NOTES
          readinessProbe:                 # only send traffic once it's connected and answering
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:                  # restart it if it stops answering
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
