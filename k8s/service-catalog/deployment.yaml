# Two catalog replicas behind one Service provide the load-balancing demonstration.
# Needs the Secret "shop-secrets" with key MONGO_URI_CATALOG.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-catalog
  labels:
    app: service-catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-catalog
  template:
    metadata:
      labels:
        app: service-catalog
    spec:
      containers:
        - name: service-catalog
          image: shop-service-catalog:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 3008
          env:
            - name: PORT
              value: "3008"
            - name: INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: shop-secrets
                  key: MONGO_URI_CATALOG
          readinessProbe:
            httpGet:
              path: /health
              port: 3008
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3008
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
