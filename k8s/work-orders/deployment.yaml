# Work Orders: the manager turns an approved booking into a work order for a mechanic.
# Checks the booking is approved by calling Booking through the gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: work-orders
  labels:
    app: work-orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: work-orders
  template:
    metadata:
      labels:
        app: work-orders
    spec:
      containers:
        - name: work-orders
          image: shop-work-orders:v2
          imagePullPolicy: Never          # built inside Minikube, not pulled from Docker Hub
          ports:
            - containerPort: 3005
          env:
            - name: PORT
              value: "3005"
            - name: INSTANCE_NAME         # the pod's own name, so we can see who answered
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: shop-secrets
                  key: MONGO_URI_WORKORDERS
            - name: GATEWAY_INTERNAL_URL  # used to ask Booking "is this booking approved?"
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: GATEWAY_INTERNAL_URL
          readinessProbe:                 # only send traffic once it's connected and answering
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:                  # restart it if it stops answering
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
