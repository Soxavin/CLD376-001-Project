# Vehicles: customers register their cars here. Talks only to vehicles_db on Atlas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicles
  labels:
    app: vehicles
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vehicles
  template:
    metadata:
      labels:
        app: vehicles
    spec:
      containers:
        - name: vehicles
          image: shop-vehicles:v2
          imagePullPolicy: Never          # built inside Minikube, not pulled from Docker Hub
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: INSTANCE_NAME         # the pod's own name, so we can see who answered
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: shop-secrets
                  key: MONGO_URI_VEHICLES
          readinessProbe:                 # only send traffic once it's connected and answering
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:                  # restart it if it stops answering
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
