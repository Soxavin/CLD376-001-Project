# deploy/ec2-1/docker-compose.yml  (EC2-1: api-gateway, registration, login)
# Run from this folder on the instance:  docker compose up -d --build
# Real settings live in ./env/*.env (gitignored). Create them from ./env.example/ (see deploy/README.md).
services:
  api-gateway:
    build: ../../services/api-gateway
    env_file: ./env/api-gateway.env
    ports: ["3000:3000"]
    restart: unless-stopped

  registration:
    build: ../../services/registration
    env_file: ./env/registration.env
    ports: ["3001:3001"]
    restart: unless-stopped

  login:
    build: ../../services/login
    env_file: ./env/login.env
    ports: ["3002:3002"]
    restart: unless-stopped
